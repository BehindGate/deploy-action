name: 'Deploy to BehindGate'
description: 'Deploy a static site to BehindGate with the bg-deploy CLI, verified against checksums pinned in this repository.'
author: 'BehindGate'

branding:
  icon: 'upload-cloud'
  color: 'blue'

inputs:
  path:
    description: |
      The folder to deploy, or an existing .zip to upload as-is.

      When given a folder, the CLI zips its CONTENTS rather than the folder
      itself, so `index.html` lands at the root of the archive -- which is what
      the platform requires. Point this at your build output (`dist`, `build`,
      `public`, ...), not at the directory above it.
    required: true

  token:
    description: |
      A BehindGate deploy token, generated in the workspace dashboard under
      Settings -> Deploy tokens. Always pass this from a secret, never inline.

      The token is the only credential, and it carries BOTH the target app and
      the deploy endpoint. See the `url` input below for why that matters.

      The value is masked in the log and is passed to the CLI through the
      environment, never on the command line.
    required: true

  url:
    description: |
      Pin the deploy endpoint instead of trusting the endpoint claim inside the
      token.

      Strongly recommended. A deploy token is simultaneously a bearer credential
      and a routing instruction, so anyone able to change this repository's
      secret can point the upload at a host they control -- and the job still
      succeeds, because from the runner's perspective nothing went wrong.

      Pinning the endpoint here stops that twice over: the destination lives in
      the workflow file, where code review and branch protection cover it, and
      since CLI 2026.8.0 a token whose own claim disagrees with this value is
      refused outright rather than silently overridden. A swapped token then
      fails the job instead of quietly deploying somewhere else.

      Example: https://app.behindgate.com/api/deploy
    required: false
    default: ''

  cli-version:
    description: |
      Escape hatch for holding a specific bg-deploy version. Normally leave
      this unset.

      BehindGate is a SaaS, so the server moves whether or not your workflow
      does. Holding an old CLI therefore buys no reproducibility -- it only
      leaves you on a client the server has moved past, and one BehindGate
      cannot ship a fix to. The default tracks the published CLI, kept current
      by a scheduled job in this repository that verifies each new release and
      opens a pull request.

      Set this only to hold the previous version after a bad CLI release.
      Superseded versions stay in versions.json for exactly that purpose, and
      the value must be one of them -- an unpinned version has no checksum to
      verify against.

      Downloads are versioned and immutable
      (`/downloads/<version>/<archive>`), so this requests a specific published
      release by name rather than asserting what the host happens to be serving.

      Minimum 2026.8.0: this Action reads the CLI's `--json` output, which
      earlier releases do not have.
    required: false
    default: ''

  download-base-url:
    description: |
      The host to download the CLI from. Archives are fetched from
      `<download-base-url>/downloads/<archive>`.

      Exposed because BehindGate serves downloads from a different host per
      environment, so this cannot be hardcoded. Override it only when you target
      a non-production environment; the checksums in versions.json must match
      whatever that host serves.

      Defaults to `defaultDownloadBaseUrl` in versions.json.
    required: false
    default: ''

outputs:
  release-id:
    description: |
      The identifier of the published release, read from the CLI's `--json`
      output.

  url:
    description: |
      The public address of the deployed site, read from the CLI's `--json`
      output.

      Empty only if the CLI reports no address; the step still succeeds in that
      case, and a warning explains why the outputs could not be populated.

runs:
  using: 'node24'
  main: 'dist/index.js'
