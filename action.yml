name: 'Deploy to BehindGate'
description: 'Deploy a static site to BehindGate with the bg-deploy CLI, verified against checksums pinned in this repository.'
author: 'BehindGate'

branding:
  icon: 'upload-cloud'
  color: 'blue'

inputs:
  path:
    description: |
      The folder to deploy, or an existing .zip to upload as-is.

      When given a folder, the CLI zips its CONTENTS rather than the folder
      itself, so `index.html` lands at the root of the archive -- which is what
      the platform requires. Point this at your build output (`dist`, `build`,
      `public`, ...), not at the directory above it.
    required: true

  token:
    description: |
      A BehindGate deploy token, generated in the workspace dashboard under
      Settings -> Deploy tokens. Always pass this from a secret, never inline.

      The token is the only credential, and it carries BOTH the target app and
      the deploy endpoint. See the `url` input below for why that matters.

      The value is masked in the log and is passed to the CLI through the
      environment, never on the command line.
    required: true

  url:
    description: |
      Pin the deploy endpoint instead of trusting the endpoint claim inside the
      token.

      Strongly recommended. A deploy token is simultaneously a bearer credential
      and a routing instruction, so anyone able to change this repository's
      secret can point the upload at a host they control -- and the job still
      succeeds, because from the runner's perspective nothing went wrong. Pinning
      the endpoint here means a swapped token can no longer redirect the build:
      the destination lives in the workflow file, where it is covered by code
      review and branch protection.

      Example: https://app.behindgate.net/api/deploy
    required: false
    default: ''

  cli-version:
    description: |
      Which bg-deploy version to use. Must be pinned in this repository's
      versions.json, which is what the download is verified against.

      Defaults to the version pinned as `defaultVersion` in versions.json.

      Note: the vendor's download URLs are currently unversioned, so this
      asserts which build the host is expected to be serving rather than
      requesting it by name. If the host serves a different build, checksum
      verification fails and the deploy stops rather than running an unverified
      binary.
    required: false
    default: ''

  download-base-url:
    description: |
      The host to download the CLI from. Archives are fetched from
      `<download-base-url>/downloads/<archive>`.

      Exposed because BehindGate serves downloads from a different host per
      environment, so this cannot be hardcoded. Override it only when you target
      a non-production environment; the checksums in versions.json must match
      whatever that host serves.

      Defaults to `defaultDownloadBaseUrl` in versions.json.
    required: false
    default: ''

outputs:
  release-id:
    description: |
      The identifier of the published release, parsed from the CLI's success
      line (`✓ Deployed. Release <id> is live.`).

  url:
    description: |
      The public address of the deployed site.

      IMPORTANT: this is empty against bg-deploy 2026.07.1. The CLI prints only
      the release id on success and never echoes the URL the deploy API returns,
      and this Action reads the CLI's output rather than calling the API itself
      (it is a thin wrapper by design). The output is declared, and populated
      automatically, as soon as the CLI exposes the value. See the README's
      "Known gaps" section.

runs:
  using: 'node24'
  main: 'dist/index.js'
