name: 'Deploy to BehindGate'
description: 'Deploy a static site to BehindGate with the bg-deploy CLI, verified against checksums pinned in this repository.'
author: 'BehindGate'

branding:
  icon: 'upload-cloud'
  color: 'blue'

inputs:
  path:
    description: |
      The folder to deploy, or an existing .zip to upload as-is.

      When given a folder, the CLI zips its CONTENTS rather than the folder
      itself, so `index.html` lands at the root of the archive -- which is what
      the platform requires. Point this at your build output (`dist`, `build`,
      `public`, ...), not at the directory above it.

      Required except with `delete-app: true`, which uploads nothing.
    required: false
    default: ''

  env:
    description: |
      Internal. Selects the BehindGate environment this Action talks to, which
      sets both the deploy endpoint and the host the CLI is downloaded from.

      Deliberately absent from the README: the environments other than the
      default are BehindGate's own, and nothing a user of this Action deploys to.
      `url` and `download-base-url` are the documented way to reach any other
      endpoint, and each wins over this input.

      It also decides how the CLI download is verified. The default is verified
      against the checksums committed in versions.json; an environment that
      republishes its builds is verified against the checksum manifest the host
      serves beside them, which is weaker and is warned about on every run.

      Values and rationale: docs/MAINTAINERS.md, "The undocumented `env` input".
    required: false
    default: 'prod'

  token:
    description: |
      A BehindGate deploy token, generated in the workspace dashboard under
      Settings -> Deploy tokens. Always pass this from a secret, never inline.

      Optional. Without it the CLI authenticates as the CI job itself: it
      exchanges the runner's OIDC token for a deploy token that lives fifteen
      minutes, so the repository stores no long-lived secret. That mode needs
      `permissions: id-token: write` on the job, and a CI trust for this
      repository in the workspace (Settings -> CI trusts). It is also the only
      mode in which `create-app` and `delete-app` work, because a deploy token is
      pinned to one app that already exists.

      A deploy token carries BOTH the target app and the deploy endpoint, which
      is why it cannot be combined with `site-url` -- see that input.

      The value is masked in the log and is passed to the CLI through the
      environment, never on the command line.
    required: false
    default: ''

  url:
    description: |
      Pin the deploy endpoint to an exact URL, overriding `env`.

      Use this for a local or dev endpoint, or where you would rather write the
      address out than name an environment. For the two published environments
      `env` is the shorter way to say the same thing, and it pins the download
      host to match.

      Why pinning matters at all: a deploy token is simultaneously a bearer
      credential and a routing instruction, so anyone able to change this
      repository's secret could point the upload at a host they control -- and
      the job would still succeed, because from the runner's perspective nothing
      went wrong. A pinned endpoint lives in the workflow file, where code review
      and branch protection cover it, and since CLI 2026.8.0 a token whose own
      claim disagrees with it is refused outright rather than silently
      overridden.

      Note this is the DEPLOY ENDPOINT, not the address your site is served on
      (that is `site-url`), and it names the releases collection rather than the
      host: the CLI posts to this URL to create a release and derives the routes
      beside it from the segment above.

      Example: https://app.behindgate.com/api/deploy/releases
    required: false
    default: ''

  site-url:
    description: |
      What to deploy to, written as the URL it serves on: the host names the
      site and the path names the app. No path means the site root.

      Example: https://docs.example.com/preview/pr-42

      Only for the CI-job credential above. A deploy token already names the site
      and the app it deploys to, so passing both `token` and `site-url` is a
      configuration error and fails the step immediately rather than deploying to
      whichever the CLI happens to prefer.

      This is NOT the deploy endpoint (`url` / `env`). They are different values:
      one is where the release is served from, the other is the API the release
      is uploaded to.
    required: false
    default: ''

  create-app:
    description: |
      Create the app named by `site-url` if it is not there yet.

      Without it a missing app is an error, so a mistyped path cannot quietly
      become a new app nobody ever looks at.

      Needs the CI-job credential (no `token`) and a CI trust holding
      "create apps".
    required: false
    default: 'false'

  delete-app:
    description: |
      Delete the app named by `site-url` and exit without deploying, for tearing
      a preview down when its pull request closes.

      A path with no app still succeeds, so a teardown job is safe to re-run.
      `path` is not required in this mode.

      Needs the CI-job credential (no `token`) and a CI trust holding
      "delete apps".
    required: false
    default: 'false'

  trust:
    description: |
      The CI trust to exchange the job's OIDC token against, when more than one
      in the workspace covers this pipeline.

      Leave it unset with a single trust: the workspace resolves the run to the
      one that covers it. Only for the CI-job credential, since a deploy token
      carries its own authority; passing both `token` and `trust` is a
      configuration error.
    required: false
    default: ''

  tags:
    description: |
      Labels to record on the release, one per line, as `name=value` or as a
      bare `name`. They are shown in the workspace's deploy history.

      Example, with the expressions written by the calling workflow:

        tags: |
          sha=${{ '${{' }} github.sha }}
          run=${{ '${{' }} github.run_number }}

      A name starts with a letter and holds letters, digits, dot, hyphen or
      underscore, and may appear once. `name=` with nothing after it records the
      bare name, so a CI expression that resolves to nothing labels the release
      rather than failing the step.

      A teardown (`delete-app`) publishes no release, so tags are ignored there.
    required: false
    default: ''

  cli-version:
    description: |
      Escape hatch for holding a specific bg-deploy version. Normally leave
      this unset.

      BehindGate is a SaaS, so the server moves whether or not your workflow
      does. Holding an old CLI therefore buys no reproducibility -- it only
      leaves you on a client the server has moved past, and one BehindGate
      cannot ship a fix to. The default tracks the published CLI, kept current
      by a scheduled job in this repository that verifies each new release and
      opens a pull request.

      Set this only to hold the previous version after a bad CLI release.
      Superseded versions stay in versions.json for exactly that purpose, and
      the value must be one of them -- an unpinned version has no checksum to
      verify against.

      Where the CLI is not verified against versions.json (see the `env` input,
      which is internal), any version the download host serves is accepted, and
      leaving this unset takes whatever that host is serving now, identified by
      its checksum rather than by a version number.

      Downloads are versioned and immutable
      (`/downloads/<version>/<archive>`), so this requests a specific published
      release by name rather than asserting what the host happens to be serving.

      Minimum 2026.8.0: this Action reads the CLI's `--json` output, which
      earlier releases do not have.
    required: false
    default: ''

  download-base-url:
    description: |
      The host to download the CLI from, overriding `env`. Archives are fetched
      from `<download-base-url>/downloads/<version>/<archive>`.

      For the two published environments `env` sets this for you. Override it
      when you serve the CLI from somewhere else entirely; the checksums in
      versions.json must match whatever that host serves, since overriding the
      host does not change which checksums are used.
    required: false
    default: ''

outputs:
  release-id:
    description: |
      The identifier of the published release, read from the CLI's `--json`
      output.

      Empty for `delete-app: true`, which publishes no release.

  url:
    description: |
      The public address of the deployed site, read from the CLI's `--json`
      output.

      Empty for `delete-app: true`, and empty if the CLI reports no address; the
      step still succeeds in that case, and a warning explains why the outputs
      could not be populated.

runs:
  using: 'node24'
  main: 'dist/index.js'
