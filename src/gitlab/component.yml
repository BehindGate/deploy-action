# Source for templates/deploy.yml.
#
# Everything except the `script:` body lives here; the body is spliced in from
# src/gitlab/deploy.sh by script/build-gitlab-template.js, so the shell stays a
# real file that `sh -n` and the integration tests can drive directly.
#
# Edit this file, not templates/deploy.yml.

spec:
  inputs:
    path:
      description: >-
        The folder to deploy, or an existing .zip to upload as-is. When given a
        folder, the CLI zips its CONTENTS rather than the folder itself, so
        index.html lands at the root of the archive, which is what the platform
        requires. Point this at your build output (dist, build, public, ...),
        not at the directory above it.
      type: string

    app-origin:
      description: >-
        The BehindGate instance to deploy to, as scheme and host with no path.
        One value fixes three things that must agree: the audience GitLab mints
        this job's OIDC token for, the deploy endpoint it is exchanged at, and
        the host the CLI is downloaded from. A token minted for one audience
        cannot be exchanged at another, so deriving all three from a single
        input is what keeps them from disagreeing. Change it only to reach a
        different instance -- the test environment, or a local one.
      type: string
      default: https://app.behindgate.com

    trust:
      description: >-
        The CI trust to exchange this job's OIDC token under, when more than one
        in the workspace covers this pipeline. Leave unset otherwise: the CLI
        resolves the single covering trust on its own. Ignored when
        BEHINDGATE_TOKEN is set, since a deploy token already names its target.
      type: string
      default: ''

    url:
      description: >-
        Override the deploy endpoint, which is otherwise `app-origin` plus
        /api/deploy/releases. Needed only where an instance does not serve the
        API at that path. This is the RELEASES collection, not its parent -- the
        CLI posts here to create a release and derives its sibling routes by
        trimming the last segment, so naming the parent puts release creation on
        the wrong route and the bare host is fronted by a CDN that answers a
        POST with 403 text/html.
        Example: https://app.behindgate.com/api/deploy/releases
      type: string
      default: ''

    cli-version:
      description: >-
        Escape hatch for holding a specific bg-deploy version after a bad
        release. Normally leave this unset. BehindGate is a SaaS, so the server
        moves whether or not your pipeline does; holding an old CLI buys no
        reproducibility and only leaves you on a client the server has moved
        past. Must be one of the versions pinned in this component -- an
        unpinned version has no checksum to verify against. Minimum 2026.8.0,
        which is where the CLI's --json output was introduced.
      type: string
      default: ''

    download-base-url:
      description: >-
        Override the host the CLI is downloaded from, which is otherwise
        `app-origin`. Archives are fetched from
        <download-base-url>/downloads/<version>/<archive>. Needed only for a
        host that serves the CLI but not the API; the pinned checksums must
        match whatever it serves.
      type: string
      default: ''

    stage:
      description: The pipeline stage the deploy job runs in.
      type: string
      default: deploy

    image:
      description: >-
        The image the job runs in. It needs a POSIX shell, tar, and either curl
        or wget; the default provides all three. Override it only if your build
        output needs something else present.
      type: string
      default: alpine:3.22

    job-name:
      description: >-
        The name of the generated job. Redefine a job of this name in your own
        .gitlab-ci.yml to override any key on it -- rules, needs, environment,
        tags.
      type: string
      default: behindgate-deploy

---

"$[[ inputs.job-name ]]":
  stage: $[[ inputs.stage ]]
  image: $[[ inputs.image ]]

  # The job authenticates as itself: GitLab mints this token for the run and sets
  # it in the environment, where the CLI reads it and exchanges it for a deploy
  # token that expires with the job. Nothing long-lived is stored anywhere, and a
  # fork cannot obtain one.
  #
  # `aud` is the input rather than a fixed value because the audience must be the
  # instance the token is exchanged at, and inputs interpolate into any job key.
  # Redefining this job REPLACES its keys, so a redefinition that drops this
  # block leaves the job with no credential at all -- the script says so by name
  # rather than letting it surface as a missing deploy token.
  id_tokens:
    BEHINDGATE_OIDC_TOKEN:
      aud: $[[ inputs.app-origin ]]

  variables:
    # Inputs reach the script as environment variables rather than being pasted
    # into its text. GitLab interpolates parsed YAML values, so a path or a URL
    # containing a quote cannot turn into shell syntax here.
    BG_APP_ORIGIN: $[[ inputs.app-origin ]]
    BG_PATH: $[[ inputs.path ]]
    BG_TRUST: $[[ inputs.trust ]]
    BG_URL: $[[ inputs.url ]]
    BG_CLI_VERSION: $[[ inputs.cli-version ]]
    BG_DOWNLOAD_BASE_URL: $[[ inputs.download-base-url ]]

  # No `cache:` and no `artifacts:`, deliberately. Both would have to name paths
  # inside $CI_PROJECT_DIR, and this component writes nothing there -- `path: .`
  # deploys that directory, so anything it left behind would be published as
  # part of the site. The CLI is downloaded and unpacked under a temporary
  # directory instead, and removed when the job ends.

  # A deploy on every branch is almost never what anyone wants. Override this
  # by redefining the job in your own .gitlab-ci.yml.
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

  script:
    - |
      # >>> BEGIN generated from src/gitlab/deploy.sh by script/build-gitlab-template.js
      # <<< END generated
