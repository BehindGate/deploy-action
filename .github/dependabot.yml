version: 2

updates:
  # Runtime and build dependencies. The bundle in dist/ must be rebuilt when
  # these change, so every one of these PRs is gated by the `dist` job in CI.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    # Conventional prefixes, so release-please sees these commits and the PR
    # title check passes. Runtime dependencies use `fix` deliberately: they are
    # bundled into dist/, so bumping one changes the code consumers execute and
    # deserves a release. Development dependencies use `chore` and release
    # nothing.
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      actions-toolkit:
        patterns:
          - '@actions/*'
      dev-dependencies:
        dependency-type: development

  # The Actions this repository's own workflows depend on.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - github-actions
    # Workflow dependencies are not shipped to consumers, so they release nothing.
    commit-message:
      prefix: ci
      include: scope
