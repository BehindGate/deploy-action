name: Publish the Bitbucket Pipe

# The Pipe is a Docker image, so a release of this repository only reaches
# Bitbucket users once the image is pushed. Gated on registry credentials being
# present, so forks -- which never receive secrets -- neither fail nor need
# them.
#
# Tags follow the repository's release tags rather than the CLI's: the Pipe is
# this wrapper, and the CLI version it carries is data (see docs/MAINTAINERS.md).
#
# Deliberately no third-party actions. This job holds registry credentials, and
# every `uses:` in it is code someone else can change under a mutable tag. The
# docker CLI is already on the runner, so buildx, QEMU and login wrappers buy
# convenience at the cost of four more parties inside the blast radius.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v1.2.3)'
        required: true
        type: string

jobs:
  check-credentials:
    name: Check for registry credentials
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      # Secrets cannot be referenced in a job-level `if:`, so the presence check
      # has to happen inside a step and be published as an output.
      - id: check
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$USERNAME" ] && [ -n "$TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Docker Hub credentials are not set; skipping the pipe publish."
          fi

  publish:
    name: Build and push
    needs: check-credentials
    if: needs.check-credentials.outputs.available == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - name: Compute tags
        id: tags
        env:
          # Passed through the environment, never interpolated into the script:
          # a tag name reaches this workflow from `github.event.release.tag_name`.
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail

          case "$TAG" in
            v[0-9]*) ;;
            *) echo "::error::Tag '$TAG' is not of the form vN.N.N"; exit 1 ;;
          esac

          VERSION="${TAG#v}"        # v1.2.3 -> 1.2.3
          MAJOR="${VERSION%%.*}"    # 1.2.3  -> 1

          {
            echo "version=${VERSION}"
            echo "major=${MAJOR}"
          } >> "$GITHUB_OUTPUT"

      # linux/amd64 only, which is what Bitbucket Cloud runs. The Dockerfile
      # reads TARGETARCH and would build arm64 unchanged, but that needs QEMU
      # emulation on the runner and nothing here can exercise the result, so it
      # is left unpublished rather than shipped untested.
      - name: Build and push
        env:
          IMAGE: behindgate/deploy-pipe
          VERSION: ${{ steps.tags.outputs.version }}
          MAJOR: ${{ steps.tags.outputs.major }}
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail

          docker build -t "$IMAGE:$VERSION" -t "$IMAGE:$MAJOR" .

          # Verify the image we are about to publish actually runs, before the
          # credentials are anywhere near the shell.
          if docker run --rm "$IMAGE:$VERSION" 2>&1 | grep -q "BEHINDGATE_TOKEN is empty"; then
            echo "Image starts and reports its configuration correctly."
          else
            echo "::error::The built image did not behave as expected; refusing to publish."
            exit 1
          fi

          printf '%s' "$TOKEN" | docker login --username "$USERNAME" --password-stdin
          trap 'docker logout >/dev/null 2>&1 || true' EXIT

          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:$MAJOR"

      - name: Summarise
        env:
          MAJOR: ${{ steps.tags.outputs.major }}
          VERSION: ${{ steps.tags.outputs.version }}
        run: |
          {
            echo "### Published behindgate/deploy-pipe:$VERSION"
            echo ""
            echo '```yaml'
            echo "- pipe: docker://behindgate/deploy-pipe:$MAJOR"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
