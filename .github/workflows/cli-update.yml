name: CLI update

# BehindGate's backend is a SaaS: it moves whether or not this repository does.
# A pinned CLI therefore buys no reproducibility, and staying pinned to an old
# build is a liability rather than a feature. But the only integrity mechanism
# available today is a hash committed here -- the vendor publishes no signatures,
# and a SHA256SUMS.txt served beside the binaries proves nothing.
#
# This job resolves that tension: it follows upstream automatically, while every
# move is still a reviewed commit with verified hashes. When the CLI is signed
# (see docs/app-repo-release-prompt.md), the Action can verify a signature at
# runtime and this job -- along with the pinned table -- becomes unnecessary.

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: cli-update
  cancel-in-progress: false

jobs:
  bump:
    name: Follow the published CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci

      - name: Adopt the served version
        run: node script/checksums.js bump

      - name: Open a pull request if the pin moved
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if git diff --quiet -- versions.json; then
            echo "No CLI update available."
            exit 0
          fi

          VERSION=$(node -p "require('./versions.json').defaultVersion")
          BRANCH="cli-update/$VERSION"

          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "$BRANCH already exists; a pull request is presumably open."
            exit 0
          fi

          # versions.json is bundled into dist/, so the bundle moves with it.
          npm run build
          npm test

          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -b "$BRANCH"
          git add versions.json dist/
          git commit -m "Pin bg-deploy $VERSION

          Adopt the version currently published on the download host. Checksums
          were computed from the downloaded archives and the binaries were
          confirmed to report this version."
          git push -u origin "$BRANCH"

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Pin bg-deploy $VERSION" \
            --body "$(cat <<EOF
          Automated by \`.github/workflows/cli-update.yml\`.

          The download host is now serving **bg-deploy $VERSION**. This pins it and
          makes it the default; the previous version stays in \`versions.json\` and
          remains selectable through \`cli-version\` if this release turns out badly.

          Checksums were computed from the downloaded archives, and every binary was
          confirmed to report \`$VERSION\` before being filed under that key.

          **Review before merging.** A changed hash is the one signal separating a
          legitimate re-release from a compromised host, which is the whole reason
          this table is committed rather than fetched at runtime.

          ---
          _Generated by [Claude Code](https://claude.ai/code)_
          EOF
          )"
