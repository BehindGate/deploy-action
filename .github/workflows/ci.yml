name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the comment lint below can reach the pull request's
          # base commit.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint
      - uses: actions/setup-python@v5
        if: ${{ github.event_name == 'pull_request' }}
        with:
          python-version: "3.12"
      # Judging only the lines this pull request adds needs a worktree at the base
      # commit, with the pull request's versions of the changed files copied in.
      - name: Comment lint (windbag)
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python -m pip install --quiet --only-binary=:all: windbag==0.1.1
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$BASE_SHA" HEAD)
          if [ "${#files[@]}" -eq 0 ]; then exit 0; fi
          base_tree="$RUNNER_TEMP/windbag-base"
          git worktree add --detach --quiet "$base_tree" "$BASE_SHA"
          # Without the rename applied, the whole destination file reads as added.
          git diff -z --name-status --diff-filter=R "$BASE_SHA" HEAD |
            while IFS= read -r -d '' _status && IFS= read -r -d '' old && IFS= read -r -d '' new; do
              mkdir -p "$base_tree/$(dirname "$new")"
              git -C "$base_tree" mv -- "$old" "$new"
            done
          if ! git -C "$base_tree" diff --cached --quiet; then
            git -C "$base_tree" -c user.email=ci@behindgate.invalid -c user.name=ci commit -qm "rename baseline"
          fi
          for f in "${files[@]}"; do
            mkdir -p "$base_tree/$(dirname "$f")"
            cp "$f" "$base_tree/$f"
          done
          cd "$base_tree"
          windbag check --config "$GITHUB_WORKSPACE/windbag.toml" --new-only "${files[@]}"

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci

      # Unit tests are pure and run everywhere. The integration tests drive the
      # real CLI against a local capture server with a fake JWT -- no secret, so
      # they run on forks too. They skip themselves on Windows (they shell out to
      # tar) and skip if the download host is unreachable.
      - run: npm test

  dist:
    name: dist/ is in sync with src/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build

      # The Action runs dist/index.js directly, so a stale bundle means the
      # published Action does not match the reviewed source.
      - name: Check for uncommitted bundle changes
        run: |
          if ! git diff --exit-code --stat -- dist/; then
            echo ""
            echo "::error::dist/ is out of date. Run 'npm run build' and commit the result."
            git diff -- dist/ | head -100
            exit 1
          fi

  checksums:
    name: versions.json matches the published artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci

      # Download URLs are unversioned, so the host can start serving a different
      # build under the same version at any time. This job turns that into a
      # visible CI failure instead of a surprise mid-deploy for a user.
      - name: Verify pinned checksums against the download host
        run: node script/checksums.js verify
