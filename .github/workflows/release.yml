name: Release

# Maintains the floating major tag (v1) that users reference as
# `behindgate/deploy-action@v1`, so they pick up patches without editing
# workflows.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to point the major tag at (e.g. v1.2.3)'
        required: true

permissions:
  contents: write

jobs:
  retag:
    name: Update the floating major tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      # Refuse to publish a release whose committed bundle does not match its
      # source. The floating tag is what users actually run, so this is the last
      # point at which a stale dist/ can be caught.
      - name: Verify the released bundle matches source
        run: |
          npm run build
          if ! git diff --exit-code --stat -- dist/; then
            echo "::error::dist/ in this tag does not match a fresh build. Refusing to move the major tag."
            exit 1
          fi

      - name: Move the major tag
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail

          case "$TAG" in
            v[0-9]*) ;;
            *) echo "::error::Tag '$TAG' is not of the form vN[.N.N]"; exit 1 ;;
          esac

          MAJOR="${TAG%%.*}"   # v1.2.3 -> v1
          echo "Pointing $MAJOR at $TAG ($(git rev-parse --short HEAD))"

          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          git tag -fa "$MAJOR" -m "Update $MAJOR to $TAG"
          git push --force origin "refs/tags/$MAJOR"

      - name: Summarise
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          MAJOR="${TAG%%.*}"
          {
            echo "### Release $TAG"
            echo ""
            echo "The floating \`$MAJOR\` tag now points at \`$TAG\`."
            echo ""
            echo '```yaml'
            echo "- uses: behindgate/deploy-action@$MAJOR"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
