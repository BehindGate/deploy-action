name: Release

# Fallback paths to the floating major tag, for releases that do not come from
# release-please:
#
#   - a release published by hand in the GitHub UI, and
#   - workflow_dispatch, to repoint the major tag after a botched release.
#
# The normal path is merging the release pull request that release-please keeps
# open; that route moves the tag from release-please.yml directly, because a
# release created with GITHUB_TOKEN does not trigger the `release` event here.
#
# Both routes call the same reusable workflow, so the dist/ verification gate
# cannot drift between them.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to point the major tag at (e.g. v1.2.3)'
        required: true

permissions:
  contents: write

jobs:
  tag-major:
    name: Update the floating major tag
    uses: ./.github/workflows/tag-major.yml
    permissions:
      contents: write
    with:
      tag: ${{ github.event.release.tag_name || inputs.tag }}
